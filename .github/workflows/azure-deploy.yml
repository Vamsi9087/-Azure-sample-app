name: Deploy to Azure Container Apps

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name mygithubdemoregistry

      - name: Build and push Docker image
        run: |
          docker build . -t mygithubdemoregistry.azurecr.io/azure-sample-app:${{ github.sha }}
          docker push mygithubdemoregistry.azurecr.io/azure-sample-app:${{ github.sha }}

      # ✅ FIXED - Added registry credentials so Container Apps can pull the image
      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          resourceGroup: rg-github-demo
          containerAppName: my-azure-sample-app
          imageToDeploy: mygithubdemoregistry.azurecr.io/azure-sample-app:${{ github.sha }}
          registryUrl: mygithubdemoregistry.azurecr.io
          registryUsername: ${{ secrets.REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.REGISTRY_PASSWORD }}name: Deploy to Azure Container Apps

